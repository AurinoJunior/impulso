<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impulso — Sobre</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
    background-color: #1a1a2e;
    color: #eaeaea;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 8vw;
  }

  p {
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 600;
    text-align: center;
  }

  .signature {
    margin-top: 1.5rem;
    font-size: clamp(0.85rem, 1.6vw, 1.05rem);
    font-weight: 400;
    opacity: 0.7;
    letter-spacing: 0.02em;
  }

  a {
    position: fixed;
    left: 1.25rem;
    bottom: 1.25rem;
    color: #eaeaea;
    opacity: 0.35;
    text-decoration: none;
    font-size: 0.85rem;
    transition: opacity 0.2s ease;
  }

  a:hover {
    opacity: 0.9;
  }
</style>
</head>
<body>
  <p>Feito com amor &#10084;&#65039;</p>
  <p class="signature">~~ Aurino Junior</p>
  <a href="/">&larr; voltar</a>
</body>
</html>
